appname = jobsy_mid
httpport = ${MID_PUERTO||9090}
runmode = ${MID_RUNMODE||dev}

# El mid solo habla JSON: sin plantillas ni sesiones de Beego.
autorender = false
copyrequestbody = true
# 1 MiB para cuerpos JSON; 12 MiB para subidas multipart.
maxmemory = 1048576
maxuploadsize = 12582912

entorno = ${MID_ENTORNO||dev}

# Obligatorio, minimo 32 caracteres. Sin valor por defecto a proposito.
jwt_secreto = ${MID_JWT_SECRETO}
jwt_duracion = ${MID_JWT_DURACION||24h}

# Lista separada por comas; "*" esta prohibido en prod.
origenes = ${MID_ORIGENES||http://localhost:4200}
timeout_upstream = ${MID_TIMEOUT_UPSTREAM||10s}

dir_archivos = ${MID_DIR_ARCHIVOS||archivos}
url_publica = ${MID_URL_PUBLICA||http://localhost:9090}
secreto_pasarela = ${MID_SECRETO_PASARELA}

url_core = ${MID_URL_CORE||http://localhost:8081}
url_usuarios = ${MID_URL_USUARIOS||http://localhost:8082}
url_empleo = ${MID_URL_EMPLEO||http://localhost:8083}
url_catalogo = ${MID_URL_CATALOGO||http://localhost:8084}
url_tienda = ${MID_URL_TIENDA||http://localhost:8085}
url_suscripciones = ${MID_URL_SUSCRIPCIONES||http://localhost:8086}
url_soporte = ${MID_URL_SOPORTE||http://localhost:8087}
servertimeout = 60
